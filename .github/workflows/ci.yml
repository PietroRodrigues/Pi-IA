name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pi.sln

      - name: Build
        run: dotnet build Pi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Pi.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install TUI dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Pi.Tui

      - name: Check TUI architecture
        run: bun run check:arch
        working-directory: src/Pi.Tui

      - name: Typecheck TUI
        run: bun run typecheck
        working-directory: src/Pi.Tui

      - name: Test TUI
        run: bun run test
        working-directory: src/Pi.Tui

      - name: Build TUI
        run: bun run build
        working-directory: src/Pi.Tui
